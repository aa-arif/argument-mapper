[project]
name = "argmap"
version = "0.2.0"
description = "Benchmarking fine-tuned small models against frontier APIs for structured argument extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aa-arif", email = "ayaan6pc@gmail.com" }]

dependencies = [
    "pydantic>=2.9",
    "numpy>=2.0",
]

[project.optional-dependencies]
# The Claude extractor and the serving stack. Kept out of the base install so
# CI can run lint/types/tests on CPU without pulling an HTTP client.
api = [
    "anthropic>=0.69",
    "python-dotenv>=1.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[project.scripts]
argmap-build-datasets = "argmap.cli.build_datasets:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argmap"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# server.py is the untouched v1 backend. It is replaced by the Extractor
# interface in milestone 2; linting it now would only produce noise.
exclude = ["server.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ANN", # annotations
    "PTH", # prefer pathlib
]
ignore = [
    "ANN401", # allow explicit Any where a schema is genuinely dynamic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "corpus: requires the real corpora in data/ (skipped in CI)",
    "gpu: requires a GPU (never runs in CI)",
    "api: spends money on the Anthropic API (never runs in CI)",
]
